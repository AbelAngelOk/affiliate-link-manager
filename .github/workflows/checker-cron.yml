# Etapa 7 (05-plan-de-desarrollo.md): dispara el verificador de disponibilidad
# cada 12h contra la API ya desplegada. Requiere dos secrets en el repo:
#   API_BASE_URL  — ej. https://links-referidos-api.fly.dev
#   INTERNAL_KEY  — el mismo INTERNAL_KEY configurado en el servidor (ver
#                   apps/api/src/plugins/requireInternalKey.ts — separado del
#                   login de usuarios, es solo para /internal/*)
name: Checker de disponibilidad

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/check
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_KEY }}" \
            "${{ secrets.API_BASE_URL }}/internal/check"
