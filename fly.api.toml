# Config de Fly.io para la API (ver 03-stack-tecnologico.md §3.6). Requiere
# un volumen persistente para el archivo SQLite — no aplica a plataformas
# serverless/edge sin disco (ver 03-stack-tecnologico.md §3.1).
#
# Vive en la raíz del repo (no en apps/api/) a propósito: el Dockerfile
# necesita como build context la raíz del monorepo (copia package-lock.json
# de acá para instalar el workspace completo), y fly usa por defecto el
# directorio donde está este archivo como contexto de build.
#
# Deploy: fly launch --config fly.api.toml
# (reemplazar `app` por un nombre único antes del primer deploy)

app = "links-referidos-api"
primary_region = "gru" # Sao Paulo — región más cercana disponible en Fly (eze/Buenos Aires ya no existe en la lista de regiones)

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/prod.db"

[mounts]
  source = "links_referidos_data"
  destination = "/data"

# Nota: no se usa [deploy] release_command para migrar — la máquina efímera
# que corre el release_command no tiene montado el volumen (limitación de
# Fly con volúmenes single-attach), así que /data no existe ahí. En cambio,
# las migraciones corren al arrancar el propio proceso (ver src/server.ts),
# que sí corre en la máquina con el volumen montado. drizzle-orm/migrator
# es idempotente, así que correrlo en cada boot es seguro.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
  method = "GET"
